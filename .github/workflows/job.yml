name: Download File from URL and Upload To Drive

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Connects the runner to Cloudflare WARP to change its IP
      - name: Setup WARP
        uses: fscarmen/warp-on-actions@v1.1
        
      - name: Run Node App
        env:
          client_id: ${{ secrets.CLIENT_ID }}
          client_secret: ${{ secrets.CLIENT_SECRET }}
          refresh_token: ${{ secrets.REFRESH_TOKEN }}
          parentFolderId: ${{ secrets.PARENTFOLDERID }}
          FIREBASE_CLIENT_EMAIL: ${{secrets.FIREBASE_CLIENT_EMAIL}}
          FIREBASE_PROJECT_ID: ${{secrets.FIREBASE_PROJECT_ID}}
          FIREBASE_PRIVATE_KEY: ${{secrets.FIREBASE_PRIVATE_KEY}}
          URL_COLLECTION_NAME: ${{secrets.URL_COLLECTION_NAME}}
        run: node FileUploader.js